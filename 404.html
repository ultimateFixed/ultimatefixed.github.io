<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ページが見つかりません</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f5f2;
  --ink: #1b1d21;
  --muted: #6b6f78;
  --faint: #a3a6ad;
  --line: #e2e0db;
  --track: #e9e7e2;
  --accent: #3d5a80;
  --accent-soft: #c9d4e3;
  --warn: #b5523b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131417;
    --ink: #ececea;
    --muted: #9a9ea6;
    --faint: #5d6169;
    --line: #26282d;
    --track: #22242a;
    --accent: #8fa9cc;
    --accent-soft: #34445b;
    --warn: #e08a72;
  }
}
:root[data-theme="dark"] {
  --bg: #131417; --ink: #ececea; --muted: #9a9ea6; --faint: #5d6169;
  --line: #26282d; --track: #22242a; --accent: #8fa9cc; --accent-soft: #34445b; --warn: #e08a72;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans JP", system-ui, sans-serif;
  font-feature-settings: "palt";
  -webkit-font-smoothing: antialiased;
  display: grid;
  grid-template-rows: auto 1fr auto;
  min-height: 100vh;
}

header, footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px clamp(16px, 5vw, 48px);
  font-size: 12px;
  letter-spacing: .08em;
  color: var(--muted);
}
header .mark { color: var(--ink); font-weight: 500; letter-spacing: .12em; }
footer { border-top: 1px solid var(--line); }
.mono { font-variant-numeric: tabular-nums; }

main {
  align-self: center;
  width: 100%;
  max-width: 880px;
  margin: 0 auto;
  padding: 48px clamp(16px, 5vw, 48px) 64px;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 28px;
  font-size: 12px;
  letter-spacing: .14em;
  color: var(--warn);
}
.eyebrow::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}

h1 {
  margin: 0;
  font-weight: 300;
  font-size: clamp(88px, 22vw, 200px);
  line-height: .9;
  letter-spacing: -.04em;
  font-variant-numeric: tabular-nums;
}
h1 .p { color: var(--faint); font-weight: 300; margin-right: .04em; }

.lead {
  margin: 28px 0 0;
  max-width: 34em;
  font-size: clamp(15px, 2.2vw, 17px);
  line-height: 1.9;
  color: var(--muted);
}
.lead strong { color: var(--ink); font-weight: 500; }

/* フェーズの進行バー。最後のフェーズの外側に現在地が来る */
.timeline { margin: 56px 0 0; }
.bar {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 2fr 3fr 3fr 1.6fr;
  gap: 3px;
  height: 8px;
}
.seg { background: var(--track); border-radius: 2px; position: relative; overflow: hidden; }
.seg::after {
  content: "";
  position: absolute; inset: 0;
  background: var(--accent-soft);
  transform-origin: left;
  transform: scaleX(0);
  animation: fill .5s cubic-bezier(.4, 0, .2, 1) forwards;
}
.seg:nth-child(1)::after { animation-delay: .15s; }
.seg:nth-child(2)::after { animation-delay: .35s; }
.seg:nth-child(3)::after { animation-delay: .6s; }
.seg:nth-child(4)::after { animation-delay: .85s; }
.seg.void { background: none; border: 1px dashed var(--line); }
.seg.void::after { display: none; }
@keyframes fill { to { transform: scaleX(1); } }

.pin {
  position: absolute;
  top: -10px; bottom: -10px;
  left: 0;
  width: 2px;
  background: var(--warn);
  animation: travel 1.5s cubic-bezier(.6, 0, .2, 1) .2s forwards;
}
.pin::before {
  content: "現在地";
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  letter-spacing: .1em;
  color: var(--warn);
  white-space: nowrap;
}
@keyframes travel { to { left: calc(100% - 7%); } }

.labels {
  display: grid;
  grid-template-columns: 1fr 2fr 3fr 3fr 1.6fr;
  gap: 3px;
  margin-top: 12px;
  font-size: 11px;
  letter-spacing: .06em;
  color: var(--faint);
}
.labels span:last-child { color: var(--warn); }

.actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 28px;
  margin-top: 56px;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 13px 22px;
  background: var(--ink);
  color: var(--bg);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: .04em;
  border-radius: 4px;
  transition: background .2s;
}
.btn:hover { background: var(--accent); }
.btn svg { transition: transform .2s; }
.btn:hover svg { transform: translateX(-3px); }
.link {
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  font-size: 14px;
  color: var(--muted);
  cursor: pointer;
  text-decoration: underline;
  text-decoration-color: var(--line);
  text-underline-offset: 5px;
  transition: color .2s, text-decoration-color .2s;
}
.link:hover { color: var(--ink); text-decoration-color: currentColor; }
.btn:focus-visible, .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.path {
  margin-top: 40px;
  font-size: 12px;
  color: var(--faint);
  word-break: break-all;
}
.path code { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; color: var(--muted); }

@media (max-width: 560px) {
  .labels span:nth-child(2), .labels span:nth-child(3) { visibility: hidden; }
  header .sub { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .seg::after { animation: none; transform: scaleX(1); }
  .pin { animation: none; left: calc(100% - 7%); }
}
</style>
</head>
<body>
<header>
  <span class="mark">ULTIMATE&nbsp;PROGRESS</span>
  <span class="sub mono">ERR&nbsp;/&nbsp;404</span>
</header>

<main>
  <p class="eyebrow">見込みにないフェーズです</p>
  <h1><span class="p">P</span>404</h1>
  <p class="lead">
    お探しのページは見つかりませんでした。<br>
    <strong>URLが変わったか、削除された可能性があります。</strong>
    一度トップに戻って立て直しましょう。
  </p>

  <div class="timeline" aria-hidden="true">
    <div class="bar">
      <div class="seg"></div>
      <div class="seg"></div>
      <div class="seg"></div>
      <div class="seg"></div>
      <div class="seg void"></div>
      <div class="pin"></div>
    </div>
    <div class="labels mono">
      <span>P1</span><span>P2</span><span>P3</span><span>P4</span><span>P404</span>
    </div>
  </div>

  <div class="actions">
    <a class="btn" id="home" href="/">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M13 7H1.5M6 2.5 1.5 7 6 11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      トップへ戻る
    </a>
    <button class="link" type="button" id="back">ひとつ前のページへ</button>
  </div>

  <p class="path">リクエストされたURL：<code id="url"></code></p>
</main>

<footer>
  <span>Wipe&nbsp;—&nbsp;立て直して再挑戦</span>
  <span class="mono" id="time"></span>
</footer>

<script>
  // GitHub Pages のプロジェクトサイト（user.github.io/repo/）ならリポジトリ直下をトップにする
  (function () {
    var home = document.getElementById('home');
    var seg = location.pathname.split('/').filter(Boolean)[0];
    if (/\.github\.io$/.test(location.hostname) && seg) home.href = '/' + seg + '/';

    document.getElementById('url').textContent = location.pathname + location.search;

    var back = document.getElementById('back');
    if (history.length > 1) back.addEventListener('click', function () { history.back(); });
    else back.hidden = true;

    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    document.getElementById('time').textContent =
      d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate()) + '  ' + p(d.getHours()) + ':' + p(d.getMinutes());
  })();
</script>
</body>
</html>
